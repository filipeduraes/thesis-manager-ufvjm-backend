events {
    worker_connections 1024;
}

http {
    upstream auth_service { server auth-service:8000; }
    upstream theses_service { server theses-service:8000; }
    upstream committee_service { server committee-service:8000; }
    upstream repository_service { server repository-service:8000; }
    upstream notifications_service { server notifications-service:8000; }
    upstream reports_service { server reports-service:8000; }

    server {
        listen 8000;
        client_max_body_size 60m;

        location = /health { proxy_pass http://auth_service/health; }

        location /api/v1/auth { proxy_pass http://auth_service; }
        location /api/v1/session { proxy_pass http://auth_service; }
        location /api/v1/users { proxy_pass http://auth_service; }
        location /api/v1/admin { proxy_pass http://auth_service; }
        location /api/v1/public/advisors { proxy_pass http://auth_service; }

        location ~ ^/api/v1/theses/[^/]+/defenses { proxy_pass http://committee_service; }
        location /api/v1/defenses { proxy_pass http://committee_service; }
        location /api/v1/theses { proxy_pass http://theses_service; }

        location /api/v1/public { proxy_pass http://repository_service; }
        location /api/v1/reports { proxy_pass http://reports_service; }
        location /api/v1/notifications { proxy_pass http://notifications_service; }

        location / {
            return 404;
        }

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
