# Configuração compartilhada pelos serviços que usam a imagem do backend
# (init, backend e workers de eventos). As credenciais vêm do .env; os valores
# padrão abaixo servem só para desenvolvimento local.
x-backend-build: &backend-build
  context: .
  dockerfile: Dockerfile

x-backend-volumes: &backend-volumes
  - .:/app
  - media_data:/app/media

x-backend-environment: &backend-environment
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-development-only-change-before-deploy}
  DEBUG: ${DEBUG:-True}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend,testserver}
  DATABASE_URL: postgres://${POSTGRES_USER:-thesis_manager_user}:${POSTGRES_PASSWORD:-local-development-only}@db:5432/${POSTGRES_DB:-thesis_manager}
  AUTH_DATABASE_URL: postgres://${POSTGRES_USER:-thesis_manager_user}:${POSTGRES_PASSWORD:-local-development-only}@db:5432/thesis_auth
  COMMITTEE_DATABASE_URL: postgres://${POSTGRES_USER:-thesis_manager_user}:${POSTGRES_PASSWORD:-local-development-only}@db:5432/thesis_committee
  REPOSITORY_QUEUE: ${REPOSITORY_QUEUE:-repository.thesis-events}
  REPORTS_QUEUE: ${REPORTS_QUEUE:-reports.thesis-events}
  REPOSITORY_DATABASE_URL: postgres://${POSTGRES_USER:-thesis_manager_user}:${POSTGRES_PASSWORD:-local-development-only}@db:5432/thesis_repository
  REPORTS_DATABASE_URL: postgres://${POSTGRES_USER:-thesis_manager_user}:${POSTGRES_PASSWORD:-local-development-only}@db:5432/thesis_reports
  NOTIFICATIONS_DATABASE_URL: postgres://${POSTGRES_USER:-thesis_manager_user}:${POSTGRES_PASSWORD:-local-development-only}@db:5432/thesis_notifications
  REDIS_URL: redis://redis:6379/0
  RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-thesis_events}:${RABBITMQ_DEFAULT_PASS:-local-development-only}@rabbitmq:5672/${RABBITMQ_DEFAULT_VHOST:-thesis_manager}
  FRONTEND_URL: http://localhost:3000
  CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-3000},http://127.0.0.1:${FRONTEND_PORT:-3000}
  CSRF_TRUSTED_ORIGINS: http://localhost:${FRONTEND_PORT:-3000},http://127.0.0.1:${FRONTEND_PORT:-3000}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-False}
  CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-False}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  INSTITUTIONAL_EMAIL_DOMAIN: ${INSTITUTIONAL_EMAIL_DOMAIN:-ufvjm.edu.br}
  TRUSTED_PROXY_COUNT: "1"
  TRUSTED_PROXY_CIDRS: "172.16.0.0/12"
  ADMIN_ALLOWED_CIDRS: "127.0.0.1/32,::1/128,172.16.0.0/12"
  SERVICE_TOKEN: ${SERVICE_TOKEN:-local-service-token-change-before-deploy}
  MEDIA_ROOT: /app/media
  SERVICE_DATABASES_SHARED: "False"
  INDEXING_QUEUE: ${INDEXING_QUEUE:-indexing.thesis-events}
  ADJUDICATION_QUEUE: ${ADJUDICATION_QUEUE:-adjudication.thesis-events}
  # E-mail de desenvolvimento: tudo vai para o Mailpit (serviço mailpit), nunca para o
  # log. O backend de console imprimiria o token do membro externo no stdout dos
  # containers. Produção configura o SMTP institucional à parte (ver README).
  EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
  EMAIL_HOST: mailpit
  EMAIL_PORT: "1025"
  EMAIL_USE_TLS: "False"
  EMAIL_HOST_USER: ""
  EMAIL_HOST_PASSWORD: ""

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thesis_manager}
      POSTGRES_USER: ${POSTGRES_USER:-thesis_manager_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    # O RabbitMQ guarda os dados por nome de nó; o hostname fixo mantém filas e
    # mensagens no volume quando o container é recriado.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-thesis_events}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-local-development-only}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-thesis_manager}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672"
    healthcheck:
      # Verifica se os listeners (AMQP e painel) aceitam conexões, não só se o nó está de pé.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Caixa de e-mail local: captura todas as mensagens (inclusive o token do membro
  # externo) sem entregá-las a ninguém. A interface web fica só em 127.0.0.1:8025;
  # a porta SMTP 1025 não é publicada e só é alcançável pelos containers do Compose.
  mailpit:
    image: axllent/mailpit:v1.32.0
    environment:
      MP_MAX_MESSAGES: "500"
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Passo único: migrações do banco e topologia do RabbitMQ, nessa ordem.
  # backend e workers só sobem depois que ele termina com sucesso.
  init:
    build: *backend-build
    working_dir: /app
    volumes: *backend-volumes
    command: sh -c "python manage.py ensure_service_databases && for db in auth default committee repository reports notifications; do python manage.py migrate --database $$db --noinput || exit 1; done && python manage.py declare_event_topology"
    environment: *backend-environment
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  backend:
    build: *backend-build
    working_dir: /app
    volumes: *backend-volumes
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    environment: *backend-environment
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"

  event-publisher:
    build: *backend-build
    working_dir: /app
    volumes: *backend-volumes
    # Forma de lista (sem sh -c) para o SIGTERM chegar ao processo Python e o encerramento ser limpo.
    command: ["python", "manage.py", "publish_outbox_events"]
    environment: *backend-environment
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-consumer:
    build: *backend-build
    working_dir: /app
    volumes: *backend-volumes
    command: ["python", "manage.py", "consume_notifications"]
    environment: *backend-environment
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  indexing-consumer:
    build: *backend-build
    working_dir: /app
    volumes: *backend-volumes
    command: ["python", "manage.py", "consume_indexing_events"]
    environment: *backend-environment
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  adjudication-consumer:
    build: *backend-build
    working_dir: /app
    volumes: *backend-volumes
    command: ["python", "manage.py", "consume_adjudication_events"]
    environment: *backend-environment
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # APIs independentes por serviço (perfil "microservices"): cada processo expõe
  # somente as rotas de sua fronteira. O serviço "backend" continua como gateway.
  auth-service:
    profiles: ["microservices"]
    build: *backend-build
    working_dir: /app
    volumes: *backend-volumes
    command: ["python", "manage.py", "runserver", "0.0.0.0:8011"]
    environment:
      <<: *backend-environment
      SERVICE_NAME: auth
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8011:8011"

  theses-service:
    profiles: ["microservices"]
    build: *backend-build
    working_dir: /app
    volumes: *backend-volumes
    command: ["python", "manage.py", "runserver", "0.0.0.0:8012"]
    environment:
      <<: *backend-environment
      SERVICE_NAME: theses
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8012:8012"

  committee-service:
    profiles: ["microservices"]
    build: *backend-build
    working_dir: /app
    volumes: *backend-volumes
    command: ["python", "manage.py", "runserver", "0.0.0.0:8013"]
    environment:
      <<: *backend-environment
      SERVICE_NAME: committee
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8013:8013"

  repository-service:
    profiles: ["microservices"]
    build: *backend-build
    working_dir: /app
    volumes: *backend-volumes
    command: ["python", "manage.py", "runserver", "0.0.0.0:8014"]
    environment:
      <<: *backend-environment
      SERVICE_NAME: repository
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8014:8014"

  notifications-service:
    profiles: ["microservices"]
    build: *backend-build
    working_dir: /app
    volumes: *backend-volumes
    command: ["python", "manage.py", "runserver", "0.0.0.0:8015"]
    environment:
      <<: *backend-environment
      SERVICE_NAME: notifications
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8015:8015"

  reports-service:
    profiles: ["microservices"]
    build: *backend-build
    working_dir: /app
    volumes: *backend-volumes
    command: ["python", "manage.py", "runserver", "0.0.0.0:8016"]
    environment:
      <<: *backend-environment
      SERVICE_NAME: reports
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8016:8016"

  repository-projection:
    build: *backend-build
    working_dir: /app
    volumes: *backend-volumes
    command: ["python", "manage.py", "consume_repository_events"]
    environment: *backend-environment
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  reports-projection:
    build: *backend-build
    working_dir: /app
    volumes: *backend-volumes
    command: ["python", "manage.py", "consume_reports_events"]
    environment: *backend-environment
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  gateway:
    profiles: ["microservices"]
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - theses-service
      - committee-service
      - repository-service
      - notifications-service
      - reports-service
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"

  frontend:
    profiles: ["frontend"]
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ../thesis-manager-ufvjm-frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm start"
    environment:
      REACT_APP_API_BASE_URL: http://127.0.0.1:${BACKEND_PORT:-8000}
      BROWSER: "none"
      HOST: 0.0.0.0
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    stdin_open: true
    tty: true

volumes:
  media_data:
  postgres_data:
  redis_data:
  rabbitmq_data:
  frontend_node_modules:
